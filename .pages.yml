media: public/images

content:
  # 博客文章（中文）
  - name: blog-zh
    label: 博客文章（中文）
    type: collection
    path: src/content/blogs
    subfolders: true
    format: yaml-frontmatter
    filename: index.{md,mdx}  
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 描述
        type: text
        required: true
      - name: publishDate
        label: 发布日期
        type: date
        required: true
      - name: updatedDate
        label: 更新日期
        type: date
      - name: tags
        label: 标签
        type: string
        list: true
      - name: category
        label: 分类
        type: string
      - name: language
        label: 语言
        type: string
      - name: draft
        label: 草稿
        type: boolean
        default: false
      - name: comment
        label: 评论
        type: boolean
        default: true
      - name: heroImage
        label: 封面图
        type: object
        fields:
          - name: src
            label: 图片
            type: image
          - name: alt
            label: 替代文本
            type: string
          - name: color
            label: 主色调
            type: string
      - name: body
        label: 正文
        type: rich-text
    view:
      primary: title
      sort: publishDate
      order: desc
      search: [title, description, tags]

  # 博客文章（英文）
  - name: blog-en
    label: Blog Posts (English)
    type: collection
    path: src/content/blogs
    subfolders: true
    format: yaml-frontmatter
    filename: index-en.{md,mdx} 
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: publishDate
        label: Publish Date
        type: date
        required: true
      - name: updatedDate
        label: Updated Date
        type: date
      - name: tags
        label: Tags
        type: string
        list: true
      - name: category
        label: Category
        type: string
      - name: language
        label: Language
        type: string
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: comment
        label: Comment
        type: boolean
        default: true
      - name: heroImage
        label: Hero Image
        type: object
        fields:
          - name: src
            label: Image
            type: image
          - name: alt
            label: Alt Text
            type: string
          - name: color
            label: Color
            type: string
      - name: body
        label: Body
        type: rich-text
    view:
      primary: title
      sort: publishDate
      order: desc
      search: [title, description, tags]

  # 文档集合
  - name: docs
    label: 文档页面
    type: collection
    path: src/content/collection
    format: yaml-frontmatter
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: title_en
        label: 英文标题
        type: string
      - name: description
        label: 描述
        type: text
      - name: description_en
        label: 英文描述
        type: text
      - name: body
        label: 正文
        type: rich-text
    view:
      primary: title
      search: [title, description]